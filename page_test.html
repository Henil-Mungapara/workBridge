<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
@page {
    size: A4 portrait;
    margin: 0;
}
html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    font-family: 'Times New Roman', serif;
}
.page {
    width: 210mm;
    height: 297mm;
    box-sizing: border-box;
    padding: 12mm 15mm;
    page-break-after: always;
    position: relative;
    background: #fff;
}
.page-inner {
    width: 100%;
    height: 100%;
    border: 3.5px double #000;
    box-sizing: border-box;
    padding: 20mm 18mm 15mm 18mm;
    position: relative;
}
.page-footer {
    position: absolute;
    bottom: 12mm;
    left: 18mm;
    right: 18mm;
    border-top: 1px solid #ccc;
    padding-top: 3mm;
    font-size: 11pt;
}
</style>
</head>
<body>
<div class='page'>
  <div class='page-inner'>
    <h1>Page 1</h1>
    <p>Content for page 1</p>
    <div class='page-footer'>1 | P a g e</div>
  </div>
</div>
<div class='page'>
  <div class='page-inner'>
    <h1>Page 2</h1>
    <p>Content for page 2</p>
    <div class='page-footer'>2 | P a g e</div>
  </div>
</div>
</body>
</html>
