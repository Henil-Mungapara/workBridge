<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
@page {
    size: A4 portrait;
    margin: 15mm 15mm 15mm 15mm;
}
body {
    margin: 0;
    padding: 0;
    font-family: 'Times New Roman', Times, serif;
    color: #000;
}
.page-container {
    width: 100%;
    min-height: 250mm;
    box-sizing: border-box;
    border: 3px double #000; /* Outer thick, inner thin double border */
    padding: 20mm 15mm 15mm 15mm;
    position: relative;
    page-break-after: always;
}
.page-footer {
    position: absolute;
    bottom: 8mm;
    left: 15mm;
    right: 15mm;
    border-top: 1px solid #ccc;
    padding-top: 2mm;
    font-size: 11pt;
    font-family: 'Times New Roman', serif;
}
h1 {
    font-size: 16pt;
    font-weight: bold;
    margin-bottom: 6pt;
}
p {
    font-size: 12pt;
    line-height: 1.3;
    text-align: justify;
    margin-bottom: 10pt;
}
</style>
</head>
<body>
<div class='page-container'>
    <h1>1 INTRODUCTION</h1>
    <h2>1.1 PROJECT SUMMARY</h2>
    <p>WorkBridge is an innovative on-demand service marketplace designed to bridge customers with skilled professionals...</p>
    <div class='page-footer'>1 | P a g e</div>
</div>
</body>
</html>
